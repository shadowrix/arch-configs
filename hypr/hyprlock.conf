background {
    monitor =
    path = screenshot
    blur_passes = 1
    blur_size = 5
}

label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    color = rgb(c0caf5)
    font_size = 64
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 52
    rounding = 14
    outline_thickness = 2
    outer_color = rgba(7aa2f799)
    inner_color = rgba(24283be6)
    font_color = rgb(c0caf5)
    check_color = rgb(bb9af7)
    fail_color = rgb(f7768e)
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center

    dots_center = true
    fade_on_empty = false
    placeholder_text = Password...
}
